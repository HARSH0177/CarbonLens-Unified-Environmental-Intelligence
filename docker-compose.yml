version: '3.8'

services:
  # 1. Macro Machine Learning Inference Microservice
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonlens-macro-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # 2. Consumer Multimodal GenAI Frontend
  frontend:
    image: node:20-alpine
    container_name: carbonlens-frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_CLIMATE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
